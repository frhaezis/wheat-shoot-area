# Copy this file and replace the paths with existing absolute folders.
# Use forward slashes on Windows. Input and output must be different;
# output must not be a descendant of input. No recursive input traversal.
input=C:/data/rgb/input
output=C:/data/rgb/output
# Empty annotations means interactive marking. For replay, use the annotation
# folder from a previous run, with the same unchanged source images.
annotations=

label_width_cm=6
pots=5
outer_margin_label_widths=2
# ImageJ HSB values use 0-255, including hue (not degrees).
hue_min=32
hue_max=83
saturation_min=60
saturation_max=255
brightness_min=35
brightness_max=255
# TSV, CSV or Semicolon. Decimal commas require TSV or Semicolon.
table_format=TSV
decimal_comma=0
save_qc=1
